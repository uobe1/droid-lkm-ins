name: build-kmi61-module

# Build a minimal external module against the Android 6.1 DDK so the device
# gate has a real cross-KMI artifact to load: a 6.1 vermagic and a 6.1
# struct-module layout in .gnu.linkonce.this_module.  The 6.12 device kernel
# must then be adapted to accept it by lkmctl-android.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk-min:android14-6.1-20260828
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Build the KMI 6.1 probe module
        shell: bash
        run: |
          set -euxo pipefail
          ls -d /opt/ddk/kdir/*
          KDIR=$(ls -d /opt/ddk/kdir/*6.1* | head -1)
          test -n "$KDIR"
          # An empty __versions is what the working droid-hook modules carry.
          # Without Module.symvers modpost emits no CRCs, so the 6.12 kernel
          # cannot reject this 6.1 build over symbol versions.
          if [ -f "$KDIR/Module.symvers" ]; then
            mv "$KDIR/Module.symvers" "$KDIR/Module.symvers.disabled-by-ci"
          fi
          make -C "$KDIR" M="$GITHUB_WORKSPACE/ci/kmi61" \
            KBUILD_MODPOST_WARN=1 modules
          KO="$GITHUB_WORKSPACE/ci/kmi61/kmi61_probe.ko"
          test -s "$KO"
          readelf -h "$KO" | head -12
          echo "=== modinfo ==="
          readelf -p .modinfo "$KO" | grep -E 'name=|vermagic='
          echo "=== layout (.this_module / __versions) ==="
          readelf -S --wide "$KO" | grep -E 'this_module|__versions'
          echo "=== init/exit relocations ==="
          readelf -r --wide "$KO" | grep -E 'init_module|cleanup_module'
          echo "=== KDIR ==="
          echo "$KDIR"

      - uses: actions/upload-artifact@v4
        with:
          name: kmi61-probe
          path: ci/kmi61/kmi61_probe.ko
          if-no-files-found: error
